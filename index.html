<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acompanhamento de Ações</title>
<style>
:root{
  --primary:#0071e3; --primary-dark:#0077ed; --primary-soft:rgba(0,113,227,.1);
  --bg:#f5f5f7; --card:#fff;
  --border:rgba(0,0,0,.08); --hair:rgba(0,0,0,.06); --text:#1d1d1f; --muted:#6e6e73;
  --hover:rgba(0,0,0,.045);
  --danger:#e44258; --ok:#34c759; --warn:#ff9f0a; --info:#5e5ce6;
  --shadow:0 10px 40px rgba(0,0,0,.14); --shadow-soft:0 1px 3px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.05);
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;letter-spacing:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);letter-spacing:inherit}
.hidden{display:none!important}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:216px;background:rgba(251,251,253,.86);backdrop-filter:saturate(180%) blur(20px);border-right:1px solid var(--hair);display:flex;flex-direction:column;flex-shrink:0}
.logo{padding:20px 16px 16px;font-weight:700;font-size:15px;color:var(--text);letter-spacing:-.2px;display:flex;align-items:center;gap:9px}
.logo .dot{width:9px;height:9px;border-radius:50%;background:var(--primary);display:inline-block}
.nav{display:flex;flex-direction:column;padding:2px 10px;gap:3px}
.nav button{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--muted);text-align:left;transition:background .13s ease,color .13s ease}
.nav button:hover{background:var(--hover);color:var(--text)}
.nav button.ativo{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav .ico{width:18px;text-align:center;font-size:14px;filter:saturate(.9)}
.sidebar-bottom{margin-top:auto;padding:10px;border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:2px}
.sidebar-bottom button{padding:8px 12px;border-radius:9px;font-size:13px;color:var(--muted);text-align:left;display:flex;gap:10px;align-items:center;transition:background .13s ease}
.sidebar-bottom button:hover{background:var(--hover);color:var(--text)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 20px;background:rgba(255,255,255,.8);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--hair);flex-wrap:wrap}
.topbar input[type=search]{padding:8px 14px;border:none;border-radius:10px;width:230px;outline:none;background:rgba(0,0,0,.05);transition:box-shadow .13s ease,background .13s ease}
.topbar input[type=search]:focus{background:#fff;box-shadow:0 0 0 3.5px rgba(0,113,227,.25)}
.topbar select{padding:8px 12px;border:none;border-radius:10px;background:rgba(0,0,0,.05);outline:none;max-width:180px;transition:box-shadow .13s ease,background .13s ease;-webkit-appearance:none;appearance:none;padding-right:26px;background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%236e6e73' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center}
.topbar select:focus{background-color:#fff;box-shadow:0 0 0 3.5px rgba(0,113,227,.25)}
.btn{padding:7px 16px;border-radius:980px;font-weight:500;font-size:13.5px;background:rgba(0,0,0,.06);color:var(--text);transition:background .13s ease,transform .1s ease}
.btn:hover{background:rgba(0,0,0,.1)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-danger{background:rgba(228,66,88,.1);color:var(--danger)}
.btn-danger:hover{background:rgba(228,66,88,.18)}
.btn-sm{padding:4px 12px;font-size:12.5px}
.btn-ghost{background:transparent;color:var(--primary);padding:4px 10px}
.btn-ghost:hover{background:var(--primary-soft)}
.spacer{flex:1}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:980px;background:rgba(0,0,0,.05);white-space:nowrap;font-weight:500}
.sync .pip{width:7px;height:7px;border-radius:50%;background:#c7c7cc}
.sync.ok .pip{background:var(--ok)} .sync.erro .pip{background:var(--danger)} .sync.proc .pip{background:var(--warn)}
.conteudo{flex:1;overflow:auto;padding:24px 28px}
.view-titulo{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.view-titulo h1{font-size:22px;font-weight:700;letter-spacing:-.4px}
.view-titulo .sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:18px;box-shadow:var(--shadow-soft)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:6px;font-size:11.5px;font-weight:600;white-space:nowrap;letter-spacing:0}
.avatar{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:10.5px;font-weight:700;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.avatar.lg{width:34px;height:34px;font-size:13px}
.prio-Critica{background:rgba(228,66,88,.13);color:#c0182f}
.prio-Alta{background:rgba(255,159,10,.16);color:#b35c00}
.prio-Media{background:rgba(0,113,227,.12);color:#0065c4}
.prio-Baixa{background:rgba(0,0,0,.06);color:var(--muted)}
.barra-progresso{height:5px;background:rgba(0,0,0,.08);border-radius:3px;overflow:hidden}
.barra-progresso i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .2s ease}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:16px;width:560px;max-width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.28);animation:mIn .18s ease}
@keyframes mIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
.modal.flargo{width:760px}
.modal-cab{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 14px;border-bottom:1px solid var(--hair)}
.modal-cab h2{font-size:16.5px;font-weight:700;letter-spacing:-.2px}
.modal-corpo{padding:18px 22px;overflow:auto}
.modal-pe{padding:14px 22px 18px;border-top:1px solid var(--hair);display:flex;justify-content:flex-end;gap:10px;background:#fbfbfd;border-radius:0 0 16px 16px}
.x{font-size:22px;color:var(--muted);line-height:1;padding:2px 9px;border-radius:8px;font-weight:300}
.x:hover{background:var(--hover);color:var(--text)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.form-grid .full{grid-column:1/-1}
.campo label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.campo input,.campo select,.campo textarea{width:100%;padding:9px 12px;border:1px solid transparent;border-radius:10px;outline:none;background:rgba(0,0,0,.05);transition:box-shadow .13s ease,background .13s ease}
.campo input:focus,.campo select:focus,.campo textarea:focus{background:#fff;box-shadow:0 0 0 3.5px rgba(0,113,227,.25)}
.campo input[disabled]{background:rgba(0,0,0,.04);color:var(--muted)}
.campo textarea{min-height:80px;resize:vertical}
.campo .nota{font-size:11.5px;color:var(--muted);margin-top:5px}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500}
.chk input{width:16px;height:16px;accent-color:var(--primary)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:rgba(29,29,31,.94);color:#fff;padding:11px 20px;border-radius:980px;font-size:13.5px;font-weight:500;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.25);animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.tabela-wrap{background:#fff;border:1px solid var(--hair);border-radius:14px;overflow:auto;box-shadow:var(--shadow-soft)}
table.grid{width:100%;border-collapse:collapse;font-size:13px}
table.grid th{position:sticky;top:0;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);text-align:left;padding:11px 14px;border-bottom:1px solid var(--hair);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap;z-index:2}
table.grid th:hover{color:var(--text)}
table.grid td{padding:10px 14px;border-bottom:1px solid var(--hair);vertical-align:middle}
table.grid tbody tr:last-child td{border-bottom:none}
table.grid tr:hover td{background:rgba(0,0,0,.025)}
table.grid tr.sel td{background:rgba(0,113,227,.07)}
table.grid tr.sub td{background:#fcfcfd}
table.grid tr.sub:hover td{background:#f7f8fa}
.tit-acoes{font-weight:600;cursor:pointer;letter-spacing:-.01em}
.tit-acoes:hover{color:var(--primary)}
tr.sub .c-tit{position:relative;padding-left:38px!important;font-weight:500;color:#3a3a3c}
tr.sub .c-tit::before{content:"";position:absolute;left:19px;top:0;bottom:0;width:1px;background:rgba(0,0,0,.13)}
tr.sub .c-tit::after{content:"";position:absolute;left:19px;top:50%;width:12px;height:1px;background:rgba(0,0,0,.13)}
.twisty{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;font-size:9px;color:var(--muted);background:rgba(0,0,0,.06);margin-right:6px;vertical-align:middle;flex-shrink:0;transition:transform .13s ease}
.twisty:hover{background:rgba(0,0,0,.12);color:var(--text)}
.twisty.fechado{transform:rotate(-90deg)}
.sub-count{font-size:11px;font-weight:600;color:var(--muted);background:rgba(0,0,0,.05);padding:2px 7px;border-radius:6px;margin-left:8px;white-space:nowrap}
.chkcell{width:36px}
.lote-bar{display:flex;gap:10px;align-items:center;padding:10px 16px;background:rgba(0,113,227,.07);border-bottom:1px solid var(--hair);font-size:13px;font-weight:500}
.kanban{display:flex;gap:16px;align-items:flex-start;overflow-x:auto;padding-bottom:12px;min-height:60vh}
.kcol{background:rgba(0,0,0,.035);border-radius:16px;width:282px;flex-shrink:0;display:flex;flex-direction:column;max-height:calc(100vh - 200px);border:1px solid transparent}
.kcol-cab{padding:14px 14px 10px;display:flex;align-items:center;gap:8px}
.kcol-cab .nome{font-weight:700;font-size:13.5px;letter-spacing:-.1px}
.kcol-cab .cnt{margin-left:auto;background:rgba(0,0,0,.07);border-radius:980px;padding:2px 9px;font-size:11.5px;font-weight:700;color:var(--muted)}
.kcol-cab .barra{height:3px;border-radius:2px;position:absolute;left:0;right:0;top:0}
.kcol{position:relative;overflow:hidden}
.kcorpo{padding:2px 10px 10px;display:flex;flex-direction:column;gap:9px;overflow-y:auto;min-height:70px}
.kcorpo.sobre{background:rgba(0,113,227,.07);border-radius:0 0 16px 16px}
.kcard{background:#fff;border-radius:12px;padding:12px 13px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 3px 10px rgba(0,0,0,.04);cursor:grab;border:1px solid rgba(0,0,0,.04);transition:box-shadow .13s ease,transform .13s ease}
.kcard:hover{box-shadow:0 2px 4px rgba(0,0,0,.06),0 10px 26px rgba(0,0,0,.09);transform:translateY(-1px)}
.kcard.arrastando{opacity:.4}
.kcard .kt{font-weight:600;font-size:13.5px;margin-bottom:9px;line-height:1.35;letter-spacing:-.1px}
.kcard .kmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kcard .prazo{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.kcard .prazo.atrasado{color:var(--danger);font-weight:700}
.kcard .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:9px}
.tag{font-size:10.5px;background:rgba(0,0,0,.05);color:var(--muted);padding:2px 7px;border-radius:5px;font-weight:600}
.kcard.subcard{background:#fbfbfd;box-shadow:none;border-style:dashed}
.kadd{margin:0 10px 10px;padding:8px 10px;border-radius:9px;color:var(--muted);font-size:13px;text-align:left;font-weight:500}
.kadd:hover{background:rgba(0,0,0,.05);color:var(--primary)}
.cal-controles{display:flex;gap:8px;align-items:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);background:#fff;border:1px solid var(--hair);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-soft)}
.cal-dow{padding:10px;text-align:center;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);background:#fbfbfd;border-bottom:1px solid var(--hair)}
.cal-dia{min-height:104px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:7px;position:relative;background:#fff}
.cal-dia:nth-child(7n){border-right:none}
.cal-dia.outro{background:#fbfbfd;color:#c7c7cc}
.cal-dia .n{font-size:13px;font-weight:600;width:25px;height:25px;display:flex;align-items:center;justify-content:center;border-radius:50%;margin-bottom:5px}
.cal-dia.hoje .n{background:var(--primary);color:#fff}
.cal-dia:hover .nadd{opacity:1}
.nadd{position:absolute;top:7px;right:7px;font-size:14px;color:var(--muted);opacity:0;padding:2px 7px;border-radius:7px;font-weight:500}
.nadd:hover{background:var(--hover);color:var(--primary);opacity:1!important}
.cal-item{font-size:11.5px;padding:4px 7px;border-radius:7px;margin-bottom:4px;cursor:pointer;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid;transition:filter .12s ease}
.cal-item:hover{filter:brightness(.94)}
.cal-item.hito{background:#fff;border:1px dashed var(--primary);color:var(--primary);border-left:3px solid var(--primary)}
.semana-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.semana-dia{background:#fff;border:1px solid var(--hair);border-radius:12px;min-height:150px;padding:10px;box-shadow:var(--shadow-soft)}
.semana-dia h4{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);margin-bottom:9px}
.entregas-painel{margin-top:22px}
.entregas-painel h3{font-size:15px;font-weight:700;letter-spacing:-.2px;margin-bottom:4px}
.entregas-painel .subp{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.ep-card{background:#fff;border:1px solid var(--hair);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-soft)}
.ep-cab{display:flex;align-items:center;gap:10px;margin-bottom:11px;padding-bottom:10px;border-bottom:1px solid var(--hair)}
.ep-cab .nm{font-weight:600;font-size:13.5px}
.ep-cab .fn{font-size:11.5px;color:var(--muted)}
.ep-cab .qtd{margin-left:auto;font-size:11px;font-weight:700;color:var(--primary);background:var(--primary-soft);padding:3px 9px;border-radius:980px}
.ep-li{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:13px;border-bottom:1px solid rgba(0,0,0,.04)}
.ep-li:last-child{border-bottom:none}
.ep-li .dt{font-size:11.5px;font-weight:700;color:var(--muted);background:rgba(0,0,0,.05);padding:3px 7px;border-radius:6px;white-space:nowrap;min-width:52px;text-align:center}
.ep-li .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.ep-li .tt:hover{color:var(--primary)}
.ep-li.prox .dt{background:rgba(0,113,227,.12);color:var(--primary)}
.ep-vazio{font-size:13px;color:var(--muted);padding:20px 0}
.gantt-wrap{background:#fff;border:1px solid var(--hair);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-soft)}
.gantt-top{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--hair);flex-wrap:wrap}
.gantt-corpo{display:flex;max-height:calc(100vh - 235px);overflow:auto;position:relative}
.gantt-esq{width:300px;flex-shrink:0;border-right:1px solid var(--hair);background:#fff;position:sticky;left:0;z-index:3}
.gantt-dir{flex:1;position:relative;min-width:600px}
.g-linha{height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--hair);font-size:13px;overflow:hidden}
.g-linha .nome{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;cursor:pointer;letter-spacing:-.01em}
.g-linha .nome:hover{color:var(--primary)}
.g-linha.grupo{background:#fbfbfd;font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);height:34px}
.g-cab{position:sticky;top:0;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);z-index:2;height:44px}
.g-cab .mes{position:absolute;top:0;height:22px;border-left:1px solid var(--hair);font-size:11px;font-weight:700;color:var(--muted);padding:3px 7px;text-transform:uppercase;letter-spacing:.3px;overflow:hidden;white-space:nowrap}
.g-cab .sub{position:absolute;top:22px;height:22px;border-left:1px solid var(--hair);font-size:10px;color:#aeaeb2;padding:4px 4px;text-align:center;overflow:hidden}
.g-fundo{position:absolute;top:44px;bottom:0;left:0;right:0}
.g-hoje{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);z-index:4;pointer-events:none}
.g-hoje::before{content:"hoje";position:absolute;top:-40px;left:-14px;font-size:10px;font-weight:700;color:#fff;background:var(--danger);padding:2px 7px;border-radius:5px}
.g-barra{position:absolute;height:26px;border-radius:8px;top:9px;cursor:grab;z-index:5;display:flex;align-items:center;font-size:11px;font-weight:600;color:#fff;overflow:visible;box-shadow:0 1px 3px rgba(0,0,0,.18);user-select:none}
.g-barra .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(0,0,0,.25);border-radius:8px 0 0 8px;pointer-events:none}
.g-barra .lbl{position:relative;z-index:1;padding:0 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.g-barra .ala{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:2}
.g-barra .ala.e{right:-3px} .g-barra .ala.i{left:-3px}
.g-barra:hover{filter:brightness(1.07)}
.g-hito{position:absolute;width:18px;height:18px;background:var(--warn);border:2.5px solid #fff;transform:rotate(45deg);top:13px;z-index:6;cursor:grab;box-shadow:0 1px 5px rgba(0,0,0,.3)}
.g-hito.rot{background:var(--danger)}
.g-leyenda{display:flex;gap:14px;font-size:11px;color:var(--muted);padding:9px 16px;border-top:1px solid var(--hair);flex-wrap:wrap}
.g-leyenda span{display:flex;align-items:center;gap:5px}
.mini{width:12px;height:12px;border-radius:4px;display:inline-block;flex-shrink:0}
.vazio{text-align:center;padding:48px 20px;color:var(--muted)}
.vazio .big{font-size:40px;margin-bottom:12px}
.vazio h3{font-size:17px;color:var(--text);margin-bottom:6px;font-weight:700;letter-spacing:-.2px}
.tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tpl{border:1.5px solid var(--border);border-radius:14px;padding:18px;cursor:pointer;text-align:left;transition:border-color .13s ease,background .13s ease,transform .13s ease;background:#fff}
.tpl:hover{border-color:var(--primary);background:#f8fbff;transform:translateY(-1px)}
.tpl h4{font-size:14.5px;margin-bottom:7px;font-weight:700;letter-spacing:-.15px}
.tpl p{font-size:12.5px;color:var(--muted);line-height:1.55}
.passos{counter-reset:p;display:flex;flex-direction:column;gap:15px}
.passo{display:flex;gap:13px}
.passo .n{counter-increment:p;width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.passo .n::before{content:counter(p)}
.passo .ct{flex:1;font-size:13.5px;line-height:1.6;color:var(--text)}
.passo .ct code{background:rgba(0,0,0,.06);padding:1px 6px;border-radius:5px;font-size:12px;word-break:break-all}
.passo .ct a{color:var(--primary);font-weight:500}
.dica{background:rgba(255,159,10,.1);border:1px solid rgba(255,159,10,.28);border-radius:10px;padding:11px 13px;font-size:13px;color:#8a5a00;margin-top:12px;line-height:1.5}
.sinc-linha{display:flex;gap:8px;align-items:center}
.sinc-linha input{flex:1;padding:9px 11px;border:1px solid var(--border);border-radius:10px}
@media(max-width:960px){.sidebar{width:64px}.logo span.tx,.nav button span.tx,.sidebar-bottom span.tx{display:none}.nav button,.sidebar-bottom button{justify-content:center}}
@media(max-width:720px){.form-grid{grid-template-columns:1fr}.tpl-grid{grid-template-columns:1fr}.topbar input[type=search]{width:130px}.gantt-esq{width:180px}.conteudo{padding:16px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo"><span class="dot"></span><span class="tx">Acompanhamento</span></div>
    <nav class="nav" id="nav">
      <button data-visao="tabela" title="Tabela"><span class="ico">📋</span><span class="tx">Tabela</span></button>
      <button data-visao="kanban" title="Kanban"><span class="ico">🗂️</span><span class="tx">Kanban</span></button>
      <button data-visao="calendario" title="Calendário"><span class="ico">📅</span><span class="tx">Calendário</span></button>
      <button data-visao="gantt" title="Gantt"><span class="ico">📈</span><span class="tx">Gantt</span></button>
    </nav>
    <div class="sidebar-bottom">
      <button id="btnMembros" title="Membros"><span>👥</span> <span class="tx">Membros do time</span></button>
      <button id="btnColunas" title="Colunas de status"><span>🗂️</span> <span class="tx">Colunas de status</span></button>
      <button id="btnConfig" title="Configurações"><span>⚙️</span> <span class="tx">Configurações</span></button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <input type="search" id="busca" placeholder="Buscar ações…  ( / )">
      <select id="filtroMembro"><option value="">Responsável: todos</option></select>
      <select id="filtroPrioridade">
        <option value="">Prioridade: todas</option>
        <option value="Critica">Crítica</option>
        <option value="Alta">Alta</option>
        <option value="Media">Média</option>
        <option value="Baixa">Baixa</option>
      </select>
      <button class="btn btn-primary" id="btnNova">＋ Nova ação</button>
      <span class="spacer"></span>
      <div class="sync" id="syncStatus"><span class="pip"></span><span class="tx">local</span></div>
    </header>
    <main class="conteudo" id="conteudo"></main>
  </div>
</div>
<div id="raizModal"></div>
<script>
"use strict";
const CHAVE = "acompanhamento-acoes-v1";
const CHAVE_CFG = "acompanhamento-acoes-sync-v1";
const PRIOS = ["Critica","Alta","Media","Baixa"];
const ROT_PRIO = {Critica:"Crítica",Alta:"Alta",Media:"Média",Baixa:"Baixa"};
const CORES = ["#e44258","#fdab3d","#00c875","#579bfc","#0073ea","#a25ddc","#00d2d2","#ff642e","#9333ea","#65a30d"];

let estado = null;
let cfg = {token:"",usuario:"",repo:"",caminho:"dados.json"};
let visaoAtual = "tabela";
let filtros = {busca:"",membro:"",prioridade:""};
let ordemTabela = {campo:"prazo",dir:1};
let selecao = new Set();
let recolhidos = new Set();
let ganttZoom = "semana";
let ganttAgrupar = "nenhum";
let calModo = "mes";
let calRef = new Date();
let timerSync = null;
let shaRemoto = null;
let conflitoResolvido = false;

function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36);}
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.from((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function hoje(){const d=new Date();d.setHours(0,0,0,0);return d;}
function dISO(d){const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");}
function parseD(s){if(!s)return null;const p=s.split("-");const d=new Date(+p[0],+p[1]-1,+p[2]);d.setHours(0,0,0,0);return d;}
function addDias(d,n){const x=new Date(d);x.setDate(x.getDate()+n);x.setHours(0,0,0,0);return x;}
function difDias(a,b){return Math.round((parseD(a)-parseD(b))/86400000);}
function fmtBR(s){const d=parseD(s);if(!d)return"—";return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear();}
function fmtCurto(s){const d=parseD(s);if(!d)return"";return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");}
function mesNome(m){return ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"][m];}
function agora(){return Date.now();}
function atrasada(a){if(!a.prazo)return false;if(progressoEfetivo(a)>=100)return false;const col=colunaPorId(a.status);if(col&&/conclu/i.test(col.nome))return false;return difDias(a.prazo,dISO(hoje()))<0;}
function venceEm(a,n){if(!a.prazo)return false;const d=difDias(a.prazo,dISO(hoje()));return d>=0&&d<=n;}
function filhosDe(id){return estado.acoes.filter(x=>x.parentId===id);}
function temFilhos(id){return estado.acoes.some(x=>x.parentId===id);}
function ehDescendente(id,ancestral){
  let atual=estado.acoes.find(x=>x.id===id);
  while(atual&&atual.parentId){
    if(atual.parentId===ancestral)return true;
    atual=estado.acoes.find(x=>x.id===atual.parentId);
  }
  return false;
}
function progressoEfetivo(a){
  const f=filhosDe(a.id);
  if(!f.length)return a.progresso||0;
  const s=f.reduce((n,x)=>n+progressoEfetivo(x),0);
  return Math.round(s/f.length);
}
function membroPorId(id){return estado.membros.find(m=>m.id===id)||null;}
function colunaPorId(id){return estado.colunas.find(c=>c.id===id)||null;}
function inicial(nome){const p=String(nome||"?").trim().split(/\s+/);return ((p[0]||"?")[0]+(p[1]?p[1][0]:"")).toUpperCase();}
function avatarHTML(m,tam){if(!m)return '<span class="avatar" style="background:#b6bcc6">?</span>';return '<span class="avatar'+(tam==="lg"?" lg":"")+'" style="background:'+esc(m.cor)+'" title="'+esc(m.nome)+'">'+esc(inicial(m.nome))+'</span>';}
function chipPrio(p){return '<span class="chip prio-'+p+'">'+esc(ROT_PRIO[p]||p)+'</span>';}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}

function estadoPadrao(){
  return {versao:1,membros:[],colunas:[
    {id:"c1",nome:"A Fazer",cor:"#c4c4c4",ordem:1},
    {id:"c2",nome:"Em Andamento",cor:"#fdab3d",ordem:2},
    {id:"c3",nome:"Concluído",cor:"#00c875",ordem:3},
    {id:"c4",nome:"Bloqueado",cor:"#e44258",ordem:4}
  ],acoes:[],config:{visaoPadrao:"tabela"},alteradoEm:0};
}
function carregar(){
  try{const j=localStorage.getItem(CHAVE);estado=j?JSON.parse(j):estadoPadrao();}catch(e){estado=estadoPadrao();}
  if(!estado.colunas||!estado.colunas.length)estado.colunas=estadoPadrao().colunas;
  if(!estado.acoes)estado.acoes=[];
  if(!estado.membros)estado.membros=[];
  try{const c=localStorage.getItem(CHAVE_CFG);if(c)cfg=Object.assign(cfg,JSON.parse(c));}catch(e){}
}
function salvar(){
  estado.alteradoEm=agora();
  try{localStorage.setItem(CHAVE,JSON.stringify(estado));}catch(e){toast("Falha ao salvar localmente (armazenamento cheio?)");}
  agendarSync();
}
function salvarCfg(){try{localStorage.setItem(CHAVE_CFG,JSON.stringify(cfg));}catch(e){}}
function filtradas(){
  const b=filtros.busca.trim().toLowerCase();
  return estado.acoes.filter(a=>{
    if(filtros.membro&&a.membroId!==filtros.membro)return false;
    if(filtros.prioridade&&a.prioridade!==filtros.prioridade)return false;
    if(b){
      const alvo=(a.titulo+" "+(a.descricao||"")+" "+((a.tags||[]).join(" "))).toLowerCase();
      if(!alvo.includes(b))return false;
    }
    return true;
  });
}
function ordenar(lista,campo,dir){
  const arr=lista.slice();
  arr.sort((x,y)=>{
    let a=x[campo],b=y[campo];
    if(campo==="membroId"){const ma=membroPorId(a),mb=membroPorId(b);a=ma?ma.nome:"";b=mb?mb.nome:"";}
    if(campo==="status"){const ca=colunaPorId(a),cb=colunaPorId(b);a=ca?ca.ordem:0;b=cb?cb.ordem:0;}
    if(a==null)a="";if(b==null)b="";
    if(typeof a==="number"&&typeof b==="number")return (a-b)*dir;
    return String(a).localeCompare(String(b),"pt-BR")*dir;
  });
  return arr;
}
function aplicarFiltrosEStatus(lista){
  return filtradas();
}
function render(){
  renderTopo();
  $$("#nav button").forEach(b=>b.classList.toggle("ativo",b.dataset.visao===visaoAtual));
  const el=$("#conteudo");
  if(visaoAtual==="tabela")renderTabela(el);
  else if(visaoAtual==="kanban")renderKanban(el);
  else if(visaoAtual==="calendario")renderCalendario(el);
  else if(visaoAtual==="gantt")renderGantt(el);
}
function renderTopo(){
  const sel=$("#filtroMembro");
  const atual=sel.value;
  sel.innerHTML='<option value="">Responsável: todos</option>'+estado.membros.map(m=>'<option value="'+m.id+'">'+esc(m.nome)+'</option>').join("");
  sel.value=atual;
  const s=$("#syncStatus");
  s.className="sync";
  if(!cfg.token){s.innerHTML='<span class="pip"></span><span class="tx">somente local</span>';}
  else if(sincStatus.erro){s.className="sync erro";s.innerHTML='<span class="pip"></span><span class="tx">erro de sync</span>';}
  else if(sincStatus.proc){s.className="sync proc";s.innerHTML='<span class="pip"></span><span class="tx">sincronizando…</span>';}
  else{s.className="sync ok";s.innerHTML='<span class="pip"></span><span class="tx">sincronizado</span>';}
}
function irPara(v){visaoAtual=v;render();}

function abrirModal(titulo,corpo,pe,extraClasse){
  const raiz=$("#raizModal");
  raiz.innerHTML='<div class="overlay"><div class="modal '+(extraClasse||"")+'">'+
    '<div class="modal-cab"><h2>'+titulo+'</h2><button class="x" data-fechar>×</button></div>'+
    '<div class="modal-corpo">'+corpo+'</div>'+
    (pe?'<div class="modal-pe">'+pe+'</div>':'')+
  '</div></div>';
  const ov=$(".overlay",raiz);
  ov.addEventListener("mousedown",e=>{if(e.target===ov)fecharModal();});
  $$("[data-fechar]",raiz).forEach(b=>b.addEventListener("click",fecharModal));
  return raiz;
}
function fecharModal(){$("#raizModal").innerHTML="";}
function formVal(id){const el=document.getElementById(id);return el?el.value.trim():"";}

function modalAcao(a,presetPai){
  const ehNova=!a;
  const acao=a||{titulo:"",descricao:"",membroId:"",status:(estado.colunas[0]||{}).id,prioridade:"Media",inicio:dISO(hoje()),prazo:"",progresso:0,entrega:false,hito:false,tags:[]};
  if(ehNova&&presetPai)acao.parentId=presetPai;
  const membroOpts='<option value="">— sem responsável —</option>'+estado.membros.map(m=>'<option value="'+m.id+'"'+(acao.membroId===m.id?" selected":"")+'>'+esc(m.nome)+'</option>').join("");
  const colOpts=estado.colunas.map(c=>'<option value="'+c.id+'"'+(acao.status===c.id?" selected":"")+'>'+esc(c.nome)+'</option>').join("");
  const prioOpts=PRIOS.map(p=>'<option value="'+p+'"'+(acao.prioridade===p?" selected":"")+'>'+ROT_PRIO[p]+'</option>').join("");
  const paiOpts='<option value="">— item principal —</option>'+estado.acoes.filter(x=>x.id!==acao.id&&!ehDescendente(x.id,acao.id||"")).map(x=>'<option value="'+x.id+'"'+(acao.parentId===x.id?" selected":"")+'>'+esc(x.titulo)+'</option>').join("");
  const nFilhos=filhosDe(acao.id||"").length;
  const progCalculado=nFilhos>0;
  const corpo=
   '<div class="form-grid">'+
    '<div class="campo full"><label>Título da ação</label><input id="fTitulo" value="'+esc(acao.titulo)+'" placeholder="Ex.: Revisar plano de comunicação" autofocus></div>'+
    '<div class="campo full"><label>Descrição</label><textarea id="fDesc" placeholder="Detalhes, contexto, links…">'+esc(acao.descricao)+'</textarea></div>'+
    '<div class="campo"><label>Responsável</label><select id="fMembro">'+membroOpts+'</select></div>'+
    '<div class="campo"><label>Status</label><select id="fStatus">'+colOpts+'</select></div>'+
    '<div class="campo"><label>Prioridade</label><select id="fPrio">'+prioOpts+'</select></div>'+
    '<div class="campo"><label>Progresso (%)</label><input id="fProg" type="number" min="0" max="100" step="5" value="'+(progCalculado?progressoEfetivo(acao):(acao.progresso||0))+'"'+(progCalculado?" disabled":"")+'>'+(progCalculado?'<div class="nota">Calculado a partir dos '+nFilhos+' sub-item(ns)</div>':"")+'</div>'+
    '<div class="campo"><label>Início</label><input id="fIni" type="date" value="'+esc(acao.inicio||"")+'"></div>'+
    '<div class="campo"><label>Prazo</label><input id="fPrazo" type="date" value="'+esc(acao.prazo||"")+'"></div>'+
    '<div class="campo full"><label>Item pai (opcional)</label><select id="fPai">'+paiOpts+'</select><div class="nota">Deixe em branco para item principal. Sub-itens ficam agrupados na tabela e alimentam o progresso do pai.</div></div>'+
    '<div class="campo full"><label>Tags (separadas por vírgula)</label><input id="fTags" value="'+esc((acao.tags||[]).join(", "))+'" placeholder="comunicação, financeiro"></div>'+
    '<div class="campo full" style="display:flex;gap:22px;flex-wrap:wrap">'+
      '<label class="chk"><input type="checkbox" id="fEntrega"'+(acao.entrega?" checked":"")+'> É uma entrega</label>'+
      '<label class="chk"><input type="checkbox" id="fHito"'+(acao.hito?" checked":"")+'> Marco / milestone</label>'+
    '</div>'+
  '</div>';
  const pe=(ehNova?"":'<button class="btn btn-danger" id="fExcluir" style="margin-right:auto">Excluir</button>')+
    '<button class="btn" data-fechar>Cancelar</button><button class="btn btn-primary" id="fSalvar">Salvar</button>';
  abrirModal(ehNova?"Nova ação":"Editar ação",corpo,pe);
  const t=$("#fTitulo");if(t)t.focus();
  $("#fSalvar").addEventListener("click",()=>{
    const titulo=formVal("fTitulo");
    if(!titulo){toast("Dê um título à ação");return;}
    const novo={
      id:acao.id||uid(),titulo,descricao:$("#fDesc").value.trim(),
      membroId:$("#fMembro").value,status:$("#fStatus").value,
      prioridade:$("#fPrio").value,
      progresso:progCalculado?progressoEfetivo(acao):Math.max(0,Math.min(100,+$("#fProg").value||0)),
      parentId:$("#fPai").value||null,
      inicio:$("#fIni").value,prazo:$("#fPrazo").value,
      tags:$("#fTags").value.split(",").map(s=>s.trim()).filter(Boolean),
      entrega:$("#fEntrega").checked,hito:$("#fHito").checked,
      criadoEm:acao.criadoEm||agora(),alteradoEm:agora()
    };
    if(acao.id){
      const i=estado.acoes.findIndex(x=>x.id===acao.id);
      estado.acoes[i]=novo;
    }else estado.acoes.push(novo);
    salvar();fecharModal();render();toast(acao.id?"Ação atualizada":"Ação criada");
  });
  const ex=$("#fExcluir");
  if(ex)ex.addEventListener("click",()=>{
    const nf=filhosDe(acao.id).length;
    if(!confirm(nf?"Excluir esta ação? Os "+nf+" sub-item(ns) serão promovidos a itens principais.":"Excluir esta ação?"))return;
    marcarRemovido("acao",acao.id);
    estado.acoes.forEach(x=>{if(x.parentId===acao.id)x.parentId=null;});
    estado.acoes=estado.acoes.filter(x=>x.id!==acao.id);
    salvar();fecharModal();render();toast("Ação excluída");
  });
}

function modalMembros(){
  const lista=estado.membros.map((m,i)=>
    '<div class="lm" data-i="'+i+'" style="cursor:default">'+avatarHTML(m,"lg")+
    '<div style="flex:1"><div style="font-weight:700">'+esc(m.nome)+'</div><div style="font-size:12px;color:var(--muted)">'+esc(m.funcao||"—")+' · '+estado.acoes.filter(a=>a.membroId===m.id&&!atrasada(a)&&a.progresso<100).length+' ações ativas</div></div>'+
    '<button class="btn btn-sm" data-editar="'+i+'">Editar</button>'+
    '<button class="btn btn-sm" data-remover="'+i+'">✕</button></div>').join("")||
    '<div class="vazio"><div class="big">👥</div><h3>Nenhum membro ainda</h3><p>Adicione as pessoas da área para atribuir ações.</p></div>';
  const corpo=lista+'<div class="dica">Dica: cada membro tem uma cor — ela aparece nos cards do Kanban, barras do Gantt e no calendário.</div>';
  const pe='<button class="btn" data-fechar>Fechar</button><button class="btn btn-primary" id="mNovo">＋ Adicionar membro</button>';
  abrirModal("Membros do time",corpo,pe);
  $("#mNovo").addEventListener("click",()=>modalMembroForm(null));
  $$("[data-remover]").forEach(b=>b.addEventListener("click",()=>{
    const i=+b.dataset.remover;const m=estado.membros[i];
    if(!confirm("Remover "+m.nome+"? As ações dele ficam sem responsável."))return;
    marcarRemovido("membro",m.id);
    estado.membros.splice(i,1);salvar();modalMembros();render();
  }));
  $$("[data-editar]").forEach(b=>b.addEventListener("click",()=>modalMembroForm(estado.membros[+b.dataset.editar])));
}
function modalMembroForm(m){
  const novo=!m;
  const membro=m||{nome:"",cor:CORES[estado.membros.length%CORES.length],funcao:""};
  const corpo='<div class="form-grid">'+
    '<div class="campo full"><label>Nome</label><input id="mNome" value="'+esc(membro.nome)+'" placeholder="Ex.: Ana Silva"></div>'+
    '<div class="campo"><label>Função</label><input id="mFuncao" value="'+esc(membro.funcao||"")+'" placeholder="Ex.: Coordenação"></div>'+
    '<div class="campo"><label>Cor</label><select id="mCor">'+CORES.map(c=>'<option value="'+c+'"'+(membro.cor===c?" selected":"")+' style="background:'+c+'">■ '+c+'</option>').join("")+'</select></div>'+
  '</div>';
  const pe='<button class="btn" id="mVoltar">Voltar</button><button class="btn btn-primary" id="mSalvar">Salvar</button>';
  abrirModal(novo?"Novo membro":"Editar membro",corpo,pe);
  $("#mNome").focus();
  $("#mVoltar").addEventListener("click",modalMembros);
  $("#mSalvar").addEventListener("click",()=>{
    const nome=formVal("mNome");
    if(!nome){toast("Informe o nome");return;}
    const obj={id:membro.id||uid(),nome,funcao:formVal("mFuncao"),cor:$("#mCor").value,alteradoEm:agora()};
    if(novo)estado.membros.push(obj);
    else{const i=estado.membros.findIndex(x=>x.id===membro.id);estado.membros[i]=obj;}
    salvar();modalMembros();render();toast("Membro salvo");
  });
}

function modalColunas(){
  const lista=estado.colunas.map((c,i)=>{
    const qtd=estado.acoes.filter(a=>a.status===c.id).length;
    return '<div class="lm" style="cursor:default"><span class="mini" style="background:'+esc(c.cor)+'"></span>'+
    '<input data-nome="'+i+'" value="'+esc(c.nome)+'" style="flex:1;padding:7px 9px;border:1px solid var(--border);border-radius:7px">'+
    '<input data-cor="'+i+'" type="color" value="'+esc(c.cor)+'" style="width:38px;height:32px;border:1px solid var(--border);border-radius:7px;padding:2px;background:#fff">'+
    '<span class="chip">'+qtd+'</span>'+
    '<button class="btn btn-sm" data-subir="'+i+'"'+(i===0?" disabled":"")+'>↑</button>'+
    '<button class="btn btn-sm" data-descer="'+i+'"'+(i===estado.colunas.length-1?" disabled":"")+'>↓</button>'+
    '<button class="btn btn-sm" data-del="'+i+'">✕</button></div>';
  }).join("");
  const corpo=lista+'<div class="dica">As colunas definem os status usados no Kanban e no Gantt. Renomeie direto no campo e clique em Salvar.</div>';
  const pe='<button class="btn" data-fechar>Fechar</button><button class="btn btn-primary" id="cSalvar">Salvar alterações</button><button class="btn" id="cNova">＋ Nova coluna</button>';
  abrirModal("Colunas de status",corpo,pe);
  $("#cNova").addEventListener("click",()=>{
    salvarInputsColunas();
    estado.colunas.push({id:uid(),nome:"Novo status",cor:CORES[(estado.colunas.length+2)%CORES.length],ordem:estado.colunas.length+1,alteradoEm:agora()});
    salvar();modalColunas();render();
  });
  $$("[data-del]").forEach(b=>b.addEventListener("click",()=>{
    salvarInputsColunas();
    const i=+b.dataset.del;const c=estado.colunas[i];
    if(estado.colunas.length<=2){toast("Mantenha ao menos 2 colunas");return;}
    if(estado.acoes.some(a=>a.status===c.id)&&!confirm('A coluna "'+c.nome+'" tem ações. Mover essas ações para "'+estado.colunas[0].nome+'"?'))return;
    marcarRemovido("coluna",c.id);
    estado.colunas.splice(i,1);
    estado.acoes.forEach(a=>{if(a.status===c.id)a.status=estado.colunas[0].id;});

function achatarTabela(lista){
  const set=new Set(lista.map(a=>a.id));
  const raizes=lista.filter(a=>!a.parentId||!set.has(a.parentId));
  const out=[];const vis=new Set();
  const add=(a,nivel)=>{
    if(vis.has(a.id))return;vis.add(a.id);
    out.push({a,nivel});
    if(recolhidos.has(a.id))return;
    lista.filter(x=>x.parentId===a.id).forEach(f=>add(f,nivel+1));
  };
  raizes.forEach(a=>add(a,0));
  return out;
}

function renderKanban(el){

    const itens=lista.filter(a=>a.status===c.id);

    return '<div class="kcol" data-col="'+c.id+'">'+

        itens.map(kcardHTML).join("")+

      '<button class="kadd" data-add="'+c.id+'">＋ Nova ação</button></div>';
  }).join("");
  el.innerHTML='<div class="view-titulo"><h1>🗂️ Kanban</h1><span class="sub">'+lista.length+' ação(ões) · arraste os cards entre colunas · clique para editar</span></div>'+
    '<div class="kanban">'+cols+'</div>';
  $$("[data-add]",el).forEach(b=>b.addEventListener("click",()=>{
    modalAcao(null);
    setTimeout(()=>{const s=$("#fStatus");if(s)s.value=b.dataset.add;},0);
  }));
  $$("[data-abrir]",el).forEach(c=>c.addEventListener("click",()=>modalAcao(estado.acoes.find(a=>a.id===c.dataset.abrir))));
  let arrastando=null;
  $$(".kcard",el).forEach(card=>{
    card.addEventListener("dragstart",e=>{arrastando=card.dataset.id;card.classList.add("arrastando");e.dataTransfer.effectAllowed="move";});
    card.addEventListener("dragend",()=>{card.classList.remove("arrastando");arrastando=null;$$(".kcorpo").forEach(k=>k.classList.remove("sobre"));});
  });
  $$("[data-drop]",el).forEach(zona=>{
    zona.addEventListener("dragover",e=>{e.preventDefault();zona.classList.add("sobre");});
    zona.addEventListener("dragleave",()=>zona.classList.remove("sobre"));
    zona.addEventListener("drop",e=>{
      e.preventDefault();zona.classList.remove("sobre");
      if(!arrastando)return;
      const a=estado.acoes.find(x=>x.id===arrastando);
      if(a&&a.status!==zona.dataset.drop){
        a.status=zona.dataset.drop;a.alteradoEm=agora();
        if(/conclu/i.test(colunaPorId(a.status).nome))a.progresso=100;
        salvar();render();
      }
    });
  });
}

function cabecalhoGantt(ini,totalDias,px){
  let html="";const larg=totalDias*px;
  if(ganttZoom==="dia"){
    for(let i=0;i<totalDias;i++){
      const d=addDias(ini,i);const fimMes=d.getDate()===1||i===0;
      if(fimMes)html+='<div class="mes" style="left:'+(i*px)+'px;width:'+(px*28)+'px">'+mesNome(d.getMonth()).slice(0,3)+"/"+d.getFullYear()+'</div>';
      const wd=d.getDay();
      html+='<div class="sub" style="left:'+(i*px)+'px;width:'+px+'px;'+(wd===0||wd===6?"background:#f0f2f5;":"")+'">'+((d.getDate()%2===1)?d.getDate():"")+'</div>';
    }
  }else if(ganttZoom==="semana"){
    let d=new Date(ini);let i=0;
    while(i<totalDias){
      const seg=dISO(d);
      const fimSem=addDias(d,6);
      const fimMes=d.getDate()<=7;
      if(fimMes)html+='<div class="mes" style="left:'+(i*px)+'px;width:'+(7*px)+'px">'+mesNome(d.getMonth())+" "+d.getFullYear()+'</div>';
      html+='<div class="sub" style="left:'+(i*px)+'px;width:'+(7*px)+'px">'+fmtCurto(seg)+'–'+fmtCurto(dISO(fimSem))+'</div>';
      d=addDias(d,7);i+=7;
    }
  }else{
    let d=new Date(ini.getFullYear(),ini.getMonth(),1);
    if(d<ini)d=new Date(ini.getFullYear(),ini.getMonth()+1,1);
    while(d<=fim0(ini,totalDias)){
      const x=((d-ini)/86400000)*px;
      const prox=new Date(d.getFullYear(),d.getMonth()+1,1);
      const w=((prox-d)/86400000)*px;
      html+='<div class="mes" style="left:'+x+'px;width:'+w+'px;border-right:1px solid var(--border)">'+mesNome(d.getMonth())+" "+String(d.getFullYear()).slice(2)+'</div>';
      html+='<div class="sub" style="left:'+x+'px;width:'+w+'px">Q'+(Math.floor(d.getMonth()/3)+1)+'</div>';
      d=prox;
    }
  }
  return html;
  function fim0(base,dias){return addDias(base,dias);}
}
function configurarDndGantt(xDe,isoDe){
  const dir=$("#ganttDir");if(!dir)return;
  $$("[data-barra]",dir).forEach(bar=>{
    const id=bar.dataset.barra;
    bar.addEventListener("mousedown",e=>{
      e.preventDefault();
      const alvo=e.target.closest("[data-ala]");
      const modo=alvo?alvo.dataset.ala:"mover";
      const a=estado.acoes.find(x=>x.id===id);
      if(!a)return;
      const startX=e.clientX;
      const ini0=a.inicio||a.prazo,fim0=a.prazo||a.inicio;
      const iniPx=xDe(ini0),fimPx=xDe(fim0);
      const mover=ev=>{
        const dx=ev.clientX-startX;
        const dIni=isoDe(iniPx+dx),dFim=isoDe(fimPx+dx);
        if(modo==="mover"){a.inicio=dIni;a.prazo=dFim;}
        else if(modo==="i"){if(dIni<=dFim)a.inicio=dIni;}
        else{if(dFim>=dIni)a.prazo=dFim;}
        bar.style.left=xDe(a.inicio||a.prazo)+"px";
        const x1=xDe(a.inicio||a.prazo),x2=Math.max(x1+10,xDe(a.prazo||a.inicio)+ (ganttZoom==="dia"?44:14));
        bar.style.width=Math.max(10,x2-x1)+"px";
      };
      const soltar=()=>{
        document.removeEventListener("mousemove",mover);
        document.removeEventListener("mouseup",soltar);
        a.alteradoEm=agora();salvar();render();
      };
      document.addEventListener("mousemove",mover);
      document.addEventListener("mouseup",soltar);
    });
    bar.addEventListener("dblclick",()=>modalAcao(estado.acoes.find(x=>x.id===id)));
  });
  $$("[data-hito]",dir).forEach(h=>{
    h.addEventListener("mousedown",e=>{
      e.preventDefault();
      const a=estado.acoes.find(x=>x.id===h.dataset.hito);
      if(!a)return;
      const startX=e.clientX;
      const x0=xDe(a.prazo||a.inicio);
      const mover=ev=>{const novo=isoDe(x0+(ev.clientX-startX));a.prazo=novo;if(!a.inicio)a.inicio=novo;h.style.left=(xDe(novo)-9)+"px";};
      const soltar=()=>{document.removeEventListener("mousemove",mover);document.removeEventListener("mouseup",soltar);a.alteradoEm=agora();salvar();render();};
      document.addEventListener("mousemove",mover);
      document.addEventListener("mouseup",soltar);
    });
    h.addEventListener("dblclick",()=>modalAcao(estado.acoes.find(x=>x.id===h.dataset.hito)));
  });
}

function b64enc(s){return btoa(unescape(encodeURIComponent(s)));}
function b64dec(s){return decodeURIComponent(escape(atob(s)));}
function apiURL(){

function mesclarRemoto(r){
  if(!r||typeof r!=="object"||!Array.isArray(r.acoes))return false;
  const antes=JSON.stringify({a:estado.acoes,m:estado.membros,c:estado.colunas});
  const tomb=new Map();
  (estado.removidos||[]).forEach(t=>tomb.set(t.id,t.em));
  (r.removidos||[]).forEach(t=>{const cur=tomb.get(t.id);if(cur==null||t.em>cur)tomb.set(t.id,t.em);});
  const vivo=(rec,em)=>!rec||(rec.alteradoEm||0)>em;
  const mapa=new Map();
  (estado.acoes||[]).forEach(a=>mapa.set(a.id,a));
  (r.acoes||[]).forEach(a=>{
    const local=mapa.get(a.id);
    if(!local)mapa.set(a.id,a);
    else if((a.alteradoEm||0)>(local.alteradoEm||0))mapa.set(a.id,a);
  });
  estado.acoes=Array.from(mapa.values()).filter(a=>{const em=tomb.get(a.id);return em==null||vivo(a,em);});
  if((r.alteradoEm||0)>(estado.alteradoEm||0)){
    if(JSON.stringify(r.membros||[])!==JSON.stringify(estado.membros||[]))estado.membros=r.membros||estado.membros;
    if(JSON.stringify(r.colunas||[])!==JSON.stringify(estado.colunas||[]))estado.colunas=r.colunas||estado.colunas;
  }
  estado.membros=(estado.membros||[]).filter(x=>{const em=tomb.get(x.id);return em==null||vivo(x,em);});
  estado.colunas=(estado.colunas||[]).filter(x=>{const em=tomb.get(x.id);return em==null||vivo(x,em);});
  if(!estado.colunas.length)estado.colunas=estadoPadrao().colunas;
  const depois=JSON.stringify({a:estado.acoes,m:estado.membros,c:estado.colunas});
  const mudou=antes!==depois;
  if(mudou){
    const t=new Set(tomb.keys());
    estado.removidos=Array.from(t.entries()).map(([id,em])=>({id,em})).slice(-300);
    localStorage.setItem(CHAVE,JSON.stringify(estado));
  }
  return mudou;
}
function marcarRemovido(tipo,id){
  estado.removidos=(estado.removidos||[]);
  const ja=estado.removidos.find(t=>t.id===id);
  if(ja)ja.em=agora();else estado.removidos.push({id,em:agora()});
  if(estado.removidos.length>300)estado.removidos=estado.removidos.slice(-300);
}
async function sincronizar(manual){
  if(!cfg.token||!cfg.usuario||!cfg.repo){if(manual)toast("Configure o GitHub em Configurações");return;}
  sincStatus={proc:true,erro:false};renderTopo();
  try{
    const resp=await fetch(apiURL(),{headers:cabecalho()});
    if(resp.status===404){
      const corpo=JSON.stringify(estado);
      const put=await fetch(apiURL(),{method:"PUT",headers:cabecalho(),body:JSON.stringify({message:"Acompanhamento: criação de dados ("+new Date().toISOString().slice(0,16)+")",content:b64enc(corpo)})});
      if(!put.ok)throw new Error("HTTP "+put.status);
      shaRemoto=(await put.json()).content.sha;
      sincStatus={proc:false,erro:false};
      if(manual)toast("Dados publicados no GitHub");
      renderTopo();return;
    }
    if(!resp.ok)throw new Error("HTTP "+resp.status);
    const info=await resp.json();
    shaRemoto=info.sha;
    let remoto=null;
    try{remoto=JSON.parse(b64dec(info.content.replace(/\n/g,"")));}catch(e){remoto=null;}
    let houveMerge=false;
    if(remoto)houveMerge=mesclarRemoto(remoto);
    const localMaisNovo=(estado.alteradoEm||0)>((remoto&&remoto.alteradoEm)||0);
    if(localMaisNovo){
      const put=await fetch(apiURL(),{method:"PUT",headers:cabecalho(),body:JSON.stringify({message:"Acompanhamento: atualização automática ("+new Date().toISOString().slice(0,16)+")",content:b64enc(JSON.stringify(estado)),sha:info.sha})});
      if(!put.ok)throw new Error("HTTP "+put.status);
      shaRemoto=(await put.json()).content.sha;
      if(manual)toast("Enviado para o GitHub");
    }else{
      if(manual)toast(houveMerge?"Dados atualizados do GitHub":"Já está atualizado");
      localStorage.setItem(CHAVE,JSON.stringify(estado));
    }
    sincStatus={proc:false,erro:false};
    if(houveMerge){
      if($("#raizModal [data-tpl]"))fecharModal();
      render();
    }
  }catch(e){
    sincStatus={proc:false,erro:true};
    if(manual)toast("Falha na sincronização: "+e.message);
  }
  renderTopo();
}

  const pe='<button class="btn" id="cfgTestar">Testar conexão</button><button class="btn" data-fechar>Fechar</button><button class="btn btn-primary" id="cfgSalvar">Salvar configuração</button>';
  abrirModal("⚙️ Configurações",corpo,pe,"flargo");
  $("#cfgSalvar").addEventListener("click",()=>{
    cfg.token=formVal("cToken");cfg.usuario=formVal("cUser");cfg.repo=formVal("cRepo");cfg.caminho=formVal("cPath")||"dados.json";
    salvarCfg();fecharModal();renderTopo();toast("Configuração salva");sincronizar(true);
  });
  $("#cfgTestar").addEventListener("click",()=>{cfg.token=formVal("cToken");cfg.usuario=formVal("cUser");cfg.repo=formVal("cRepo");cfg.caminho=formVal("cPath")||"dados.json";salvarCfg();sincronizar(true);});
  $("#cfgExpJson").addEventListener("click",exportarJSON);
  $("#cfgImpJson").addEventListener("click",importarJSON);
  $("#cfgExpCsv").addEventListener("click",exportarCSV);
  $("#cfgZap").addEventListener("click",()=>{
    if(!confirm("Isso apaga TODOS os dados locais (o arquivo no GitHub continua). Continuar?"))return;
    if(!confirm("Tem certeza? Essa ação não pode ser desfeita."))return;
    localStorage.removeItem(CHAVE);estado=estadoPadrao();salvar();fecharModal();render();toast("Dados locais apagados");
  });
}
function baixar(nome,conteudo,tipo){
  const blob=new Blob([conteudo],{type:tipo||"application/json;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=nome;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function exportarJSON(){baixar("acompanhamento-acoes-"+dISO(hoje())+".json",JSON.stringify(estado,null,2));toast("JSON exportado");}
function importarJSON(){
  const inp=document.createElement("input");inp.type="file";inp.accept=".json,application/json";
  inp.onchange=()=>{
    const f=inp.files[0];if(!f)return;
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const novo=JSON.parse(fr.result);
        if(!novo||!Array.isArray(novo.acoes))throw new Error("formato inválido");
        if(!confirm("Importar substitui os dados locais atuais. Continuar?"))return;
        estado=Object.assign(estadoPadrao(),novo);salvar();render();toast("JSON importado");
      }catch(e){toast("Arquivo inválido: "+e.message);}
    };
    fr.readAsText(f);
  };
  inp.click();
}
function csvEscape(v){const s=String(v==null?"":v);return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function exportarCSV(){
  const linhas=[["id","titulo","descricao","responsavel","status","prioridade","inicio","prazo","progresso","entrega","hito","tags","id_pai"].join(";")];
  filtradas().forEach(a=>{
    const m=membroPorId(a.membroId),c=colunaPorId(a.status);
    linhas.push([a.id,csvEscape(a.titulo),csvEscape(a.descricao),csvEscape(m?m.nome:""),csvEscape(c?c.nome:""),a.prioridade,a.inicio,a.prazo,a.progresso,a.entrega?"sim":"nao",a.hito?"sim":"nao",csvEscape((a.tags||[]).join(",")),a.parentId||""].join(";"));
  });
  baixar("acoes-"+dISO(hoje())+".csv","\ufeff"+linhas.join("\r\n"),"text/csv;charset=utf-8");
  toast("CSV exportado");
}
function importarCSV(){
  const inp=document.createElement("input");inp.type="file";inp.accept=".csv,text/csv";
  inp.onchange=()=>{
    const f=inp.files[0];if(!f)return;
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const txt=String(fr.result).replace(/^\ufeff/,"");
        const linhas=txt.split(/\r?\n/).filter(l=>l.trim());
        if(linhas.length<2)throw new Error("arquivo vazio");
        const sep=linhas[0].includes(";")?";":",";
        let n=0;
        linhas.slice(1).forEach(l=>{
          const c=lerCSV(l,sep);
          if(!c[1])return;
          const membro=estado.membros.find(m=>m.nome.toLowerCase()===String(c[3]||"").toLowerCase());
          const col=estado.colunas.find(x=>x.nome.toLowerCase()===String(c[4]||"").toLowerCase())||estado.colunas[0];
          const obj={
            id:c[0]||uid(),titulo:c[1],descricao:c[2]||"",membroId:membro?membro.id:"",
            status:col?col.id:"",prioridade:PRIOS.includes(c[5])?c[5]:"Media",
            inicio:c[6]||"",prazo:c[7]||"",progresso:Math.max(0,Math.min(100,+c[8]||0)),
            entrega:String(c[9]||"").toLowerCase()==="sim",hito:String(c[10]||"").toLowerCase()==="sim",
            tags:String(c[11]||"").split(",").map(s=>s.trim()).filter(Boolean),
            parentId:String(c[12]||"").trim()||null,
            criadoEm:agora(),alteradoEm:agora()
          };
          const i=estado.acoes.findIndex(x=>x.id===obj.id);
          if(i>=0)estado.acoes[i]=Object.assign(estado.acoes[i],obj,{alteradoEm:agora()});
          else estado.acoes.push(obj);
          n++;
        });
        salvar();render();toast(n+" ação(ões) importada(s)");
      }catch(e){toast("Falha no CSV: "+e.message);}
    };
    fr.readAsText(f);
  };
  inp.click();
}
function lerCSV(linha,sep){
  const out=[];let cur="";let asp=false;
  for(let i=0;i<linha.length;i++){
    const ch=linha[i];
    if(asp){
      if(ch==='"'){if(linha[i+1]==='"'){cur+='"';i++;}else asp=false;}
      else cur+=ch;
    }else{
      if(ch==='"')asp=true;
      else if(ch===sep){out.push(cur);cur="";}
      else cur+=ch;
    }
  }
  out.push(cur);return out;
}

function atalhos(e){
  const t=e.target;
  if(t&&t.matches&&t.matches("input,textarea,select")){if(e.key==="Escape")fecharModal();return;}
  if(e.key==="/"){e.preventDefault();$("#busca").focus();}
  else if(e.key==="n"||e.key==="N"){e.preventDefault();modalAcao(null);}
  else if(e.key==="Escape")fecharModal();
  else if(e.key>="1"&&e.key<="4"){const v=["tabela","kanban","calendario","gantt"][+e.key-1];if(v)irPara(v);}
}
function init(){
  carregar();
  visaoAtual=(estado.config&&estado.config.visaoPadrao)||"tabela";
  if(!["tabela","kanban","calendario","gantt"].includes(visaoAtual))visaoAtual="tabela";
  $$("#nav button").forEach(b=>b.addEventListener("click",()=>{
    visaoAtual=b.dataset.visao;
    if(estado.config)estado.config.visaoPadrao=visaoAtual;
    salvar();render();
  }));
  $("#btnNova").addEventListener("click",()=>modalAcao(null));
  $("#btnMembros").addEventListener("click",modalMembros);
  $("#btnColunas").addEventListener("click",modalColunas);
  $("#btnConfig").addEventListener("click",modalConfig);
  $("#busca").addEventListener("input",e=>{filtros.busca=e.target.value;render();});
  $("#filtroMembro").addEventListener("change",e=>{filtros.membro=e.target.value;render();});
  $("#filtroPrioridade").addEventListener("change",e=>{filtros.prioridade=e.target.value;render();});
  document.addEventListener("keydown",atalhos);
  if(!(estado.config&&estado.config.inicializado)&&!estado.acoes.length&&!estado.membros.length){
    modalTemplate();
  }else{
    render();
  }
  if(cfg.token&&cfg.usuario&&cfg.repo)sincronizar(false);
  else renderTopo();
  window.addEventListener("beforeunload",()=>{if(cfg.token&&timerSync){clearTimeout(timerSync);}});
}
init();
/*__FIM__*/
</script>
