name: Avisos por email

on:
  schedule:
    # 13:13 UTC = 10:13 de Brasília (seg-sex). Minuto fora do topo da hora
    # reduz atrasos/congestionamento do agendador do GitHub Actions.
    - cron: "13 13 * * 1-5"
  workflow_dispatch: # permite disparar manualmente pela aba Actions

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Instalar nodemailer
        run: npm install nodemailer
      - name: Enviar avisos por email
        run: node scripts/avisos.js
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SITE_URL: ${{ secrets.SITE_URL }}
          EMAIL_ADMIN: ${{ secrets.EMAIL_ADMIN }}
