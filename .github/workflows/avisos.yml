name: Avisos por email

on:
  schedule:
    - cron: "0 11 * * *" # 11h UTC = 8h de Brasília (todo dia)
  workflow_dispatch: # permite disparar manualmente pela aba Actions

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar nodemailer
        run: npm install nodemailer
      - name: Enviar avisos por email
        run: node scripts/avisos.js
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SITE_URL: ${{ secrets.SITE_URL }}
